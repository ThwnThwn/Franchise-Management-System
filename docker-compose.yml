services:
  # ==========================================
  # 1. DATABASE: POSTGRESQL
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: chb_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - chb-network

  # ==========================================
  # 2. CACHE: REDIS
  # ==========================================
  redis:
    image: redis:alpine
    container_name: chb_redis
    restart: always
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    networks:
      - chb-network

  # ==========================================
  # 3. MESSAGE BROKER: KAFKA (No RabbitMQ)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: chb_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:${ZOOKEEPER_PORT}"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - chb-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: chb_kafka
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - chb-network

  # ==========================================
  # 4. UI TOOLS (Optional - Debug Only)
  # ==========================================
  # Giao diện xem Kafka cho dễ (Truy cập localhost:9000)
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: chb_kafdrop
    depends_on:
      - kafka
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: kafka:29092
    networks:
      - chb-network

  # ==========================================
  # 5. SEARCH ENGINE: ELASTICSEARCH
  # ==========================================
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
  #   container_name: chb_elasticsearch
  #   restart: always
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false # Tắt bảo mật để Dev local cho dễ
  #     - "ES_JAVA_OPTS=-Xms512m -Xmx512m" # Giới hạn RAM
  #   ports:
  #     - "${ELASTIC_PORT:-9200}:9200"
  #   volumes:
  #     - elastic_data:/usr/share/elasticsearch/data
  #   networks:
  #     - chb-network

    # ==========================================
  # 7. ROUTING ENGINE: OSRM (Open Source Routing Machine)
  # ==========================================
  osrm:
    image: osrm/osrm-backend
    container_name: chb_osrm
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - ./osrm_data:/data
    # Tự động hóa quá trình xử lý dữ liệu nếu chưa tồn tại
    entrypoint: >
      /bin/sh -c "
        if [ ! -f /data/Saigon.osrm ]; then
          echo 'Data not found, starting preprocessing...' &&
          osrm-extract -p /opt/car.lua /data/Saigon.osm.pbf &&
          osrm-partition /data/Saigon.osrm &&
          osrm-customize /data/Saigon.osrm;
        fi;
        echo 'Starting OSRM server...' &&
        osrm-routed --algorithm mld /data/Saigon.osrm;
      "
    # Giới hạn tài nguyên để bảo vệ Server
    deploy:
      resources:
        limits:
          memory: 512M    # Giới hạn tối đa 512MB RAM (rất dư cho map Sài Gòn)
        reservations:
          memory: 256M    # Luôn giữ chỗ ít nhất 256MB RAM
    networks:
      - chb-network

  # ==========================================
  # 8. NGROK TẠO TUNNEL CHO VNPAY (Sale + Supplier Service)
  #    Dashboard: http://localhost:4040
  #    Sale:     http://localhost:4040 → Tunnels → sale_service
  #    Supplier: http://localhost:4040 → Tunnels → supplier_service
  # ==========================================
  ngrok:
    image: ngrok/ngrok:latest
    container_name: chb_ngrok
    restart: always
    environment:
      - NGROK_AUTHTOKEN=3BKJy37D0WIsrbZVw1FNKO7r83f_7ybnijwu8i2miaPScahL8
      # Cấu hình Cloudinary tại đây
      - CLOUDINARY_CLOUD_NAME=dq9xxhsmf
      - CLOUDINARY_API_KEY=339971318777718
      - CLOUDINARY_API_SECRET=Itf_jo70xY8_z143Yyc123IDbgE
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml
    command:
      - "start"
      - "--all"
      - "--config"
      - "/etc/ngrok.yml"
    ports:
      - "4040:4040"
    networks:
      - chb-network
      
# ==========================================
# VOLUMES & NETWORKS
# ==========================================
volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  elastic_data:

networks:
  chb-network:
    driver: bridge
