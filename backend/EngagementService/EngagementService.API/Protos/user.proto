syntax = "proto3";

option csharp_namespace = "IdentityService.Grpc.Protos.User";

package identity.user;

service UserGrpc {
	rpc GetUserIdByPhone(GetUserIdByPhoneRequest) returns (UserIdsResponse);
   rpc GetUserIdByEmail(GetUserIdByEmailRequest) returns (UserIdsResponse);
}

message GetUserIdByPhoneRequest {
  optional string phone = 1;
}

message UserIdsResponse {
  repeated string ids = 1;
}

message GetUserIdByEmailRequest {
  optional string email = 1;
}