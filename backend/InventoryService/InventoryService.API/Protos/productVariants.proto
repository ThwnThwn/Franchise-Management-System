syntax = "proto3";

import "google/protobuf/empty.proto";
option csharp_namespace = "ProductService.Grpc";

package productvariant;

service ProductVariantGrpc {
  rpc GetById (GetProductVariantByIdRequest)
      returns (GetProductVariantByIdResponse);

  // Update variant costs (called by InventoryService after MAC calculation)
  rpc UpdateVariantCosts (UpdateVariantCostsRequest) returns (google.protobuf.Empty);
}

message GetProductVariantByIdRequest {
  string product_variant_id = 1; 
}

message GetProductVariantByIdResponse {
  string id = 1;
  string sku = 2;
  string name = 3;
  string attributes = 4;
  double base_price = 5;
  double cost = 6;
  bool is_active = 7;
  string updated_at = 8;
  string product_id = 9;
}

// ── UpdateVariantCosts ──
message UpdateVariantCostsRequest {
  repeated VariantCostUpdate updates = 1;
}

message VariantCostUpdate {
  string variant_id = 1;
  double new_cost = 2;
}
