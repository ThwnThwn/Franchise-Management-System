syntax = "proto3";

option csharp_namespace = "ProductService.Grpc";

package productvariant;

service ProductVariantGrpc {
  rpc GetById (GetProductVariantByIdRequest)
      returns (GetProductVariantByIdResponse);
}

message GetProductVariantByIdRequest {
  string product_variant_id = 1; 
}

message GetProductVariantByIdResponse {
  string id = 1;
  string sku = 2;
  string name = 3;
  string attributes = 4;
  double base_price = 5;
  double cost = 6;
  bool is_active = 7;
  string updated_at = 8;
  string product_id = 9;
}
