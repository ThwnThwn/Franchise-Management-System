syntax = "proto3";

option csharp_namespace = "IdentityService.Grpc.Protos.User";
option go_package = "api-gateway/pkg/pb/identity";
import "google/protobuf/timestamp.proto";

package identity.user;

service UserGrpc {
	rpc GetManager(GetManagerRequest) returns (UserResponse);
}

message UserResponse {
  string id = 1;
  string email = 2;
  string username = 3;
  string phone = 4;
  string address = 5;
  bool isBlocked = 6;

  string firstName = 7;
  string lastName = 8;
  int32 gender = 9;
  google.protobuf.Timestamp dateOfBirth = 10;

  RoleUserResponse role = 11;
  google.protobuf.Timestamp createdAt = 12;
  google.protobuf.Timestamp updatedAt = 13;
}

message GetManagerRequest{
  string id = 1;
}

message RoleUserResponse {
  string id = 1;
  string name = 2;
  string slug = 3;
}