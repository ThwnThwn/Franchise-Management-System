basePath: /api
definitions:
  auth.ConfirmOtpRequest:
    properties:
      email:
        type: string
      otp:
        type: string
    required:
    - email
    - otp
    type: object
  auth.LoginRequest:
    properties:
      emailOrUsername:
        type: string
      password:
        type: string
    required:
    - emailOrUsername
    - password
    type: object
  auth.NewPasswordRequest:
    properties:
      confirmPassword:
        type: string
      newPassword:
        type: string
    required:
    - confirmPassword
    - newPassword
    type: object
  auth.RegisterRequest:
    properties:
      address:
        type: string
      confirmPassword:
        type: string
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      gender:
        type: integer
      lastName:
        type: string
      password:
        maxLength: 30
        minLength: 6
        type: string
      phone:
        type: string
      username:
        type: string
    required:
    - address
    - confirmPassword
    - dateOfBirth
    - email
    - firstName
    - gender
    - password
    - phone
    - username
    type: object
  auth.SendOtpRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  permission.UpdatePermissionInfoRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  role.CreateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
      slug:
        type: string
    type: object
  role.UpdateRolePermissionsRequest:
    properties:
      permissionsToGrant:
        items:
          type: string
        type: array
      permissionsToRevoke:
        items:
          type: string
        type: array
    type: object
  role.UpdateRoleRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  user.ChangePasswordRequest:
    properties:
      confirmNewPassword:
        type: string
      forgetAll:
        type: boolean
      newPassword:
        maxLength: 30
        minLength: 6
        type: string
      oldPassword:
        maxLength: 30
        minLength: 6
        type: string
    required:
    - confirmNewPassword
    - newPassword
    - oldPassword
    type: object
  user.CreateUserRequest:
    properties:
      address:
        type: string
      currentHourlyWage:
        type: number
      dateOfBirth:
        type: string
      email:
        type: string
      firstName:
        type: string
      gender:
        type: integer
      homeStoreId:
        type: string
      lastName:
        type: string
      phone:
        type: string
      roleSlug:
        type: string
      username:
        type: string
    required:
    - email
    - gender
    - roleSlug
    - username
    type: object
  user.UpdateMeRequest:
    properties:
      address:
        type: string
      dateOfBirth:
        type: string
      firstName:
        type: string
      gender:
        type: integer
      lastName:
        type: string
      phone:
        description: Email       string `json:"email"`
        type: string
    type: object
  user.UpdateUserRequest:
    properties:
      address:
        type: string
      currentHourlyWage:
        type: number
      dateOfBirth:
        type: string
      firstName:
        type: string
      gender:
        type: integer
      homeStoreId:
        type: string
      isBlocked:
        type: boolean
      lastName:
        type: string
      phone:
        description: Email       string `json:"email"`
        type: string
      roleSlug:
        type: string
      username:
        type: string
    type: object
  user.UpdateUserRoleRequest:
    properties:
      roleSlug:
        type: string
    required:
    - roleSlug
    type: object
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: API docs for CHD Gateway.
  termsOfService: http://swagger.io/terms/
  title: Capital Franchise Supply Chain Management System API Document
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows the logged-in user to change their password. Requires a
        valid Access Token.
      parameters:
      - description: Old and New Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized or missing token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change Password
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates the password reset process by sending an OTP to the provided
        email address.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request Password Reset
      tags:
      - Auth
  /auth/forgot-password/confirm-otp:
    post:
      consumes:
      - application/json
      description: Verifies the OTP sent to the email. If successful, a 'forgot_password_token'
        HttpOnly cookie will be set, which is required for setting the new password.
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ConfirmOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message and sets cookie
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Password Reset OTP
      tags:
      - Auth
  /auth/forgot-password/new-password:
    post:
      consumes:
      - application/json
      description: Finalizes the password reset process. This endpoint requires the
        'forgot_password_token' cookie obtained from the OTP verification step.
      parameters:
      - description: New Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.NewPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing cookie or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set New Password
      tags:
      - Auth
  /auth/forgot-password/resend-otp:
    post:
      consumes:
      - application/json
      description: Resends the OTP for password reset if the previous one expired.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend Password Reset OTP
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Enter username/email and password to get access token
      parameters:
      - description: Login Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the current access token and clears the refresh token
        cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Obtains a new access token using the valid refresh token stored
        in the HttpOnly cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Returns new Access Token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing cookie
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh Access Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account. After successful registration, an OTP
        will be sent to the email for verification.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new account
      tags:
      - Auth
  /auth/register/confirm-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP sent to email to activate the new account.
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ConfirmOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status and message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Registration OTP
      tags:
      - Auth
  /auth/register/resend-otp:
    post:
      consumes:
      - application/json
      description: Resend the activation OTP if the previous one expired or was not
        received.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend Registration OTP
      tags:
      - Auth
  /permissions:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all system permissions, grouped by their module
        or category.
      produces:
      - application/json
      responses:
        "200":
          description: List of permissions grouped by module
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get All Permissions (Grouped)
      tags:
      - Permissions
  /permissions/{id}:
    patch:
      consumes:
      - application/json
      description: Update details (e.g., description, name) of a specific permission
        by its ID.
      parameters:
      - description: Permission UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/permission.UpdatePermissionInfoRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update Permission
      tags:
      - Permissions
  /roles:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all defined roles in the system.
      produces:
      - application/json
      responses:
        "200":
          description: List of roles
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get All Roles
      tags:
      - Roles
    post:
      consumes:
      - application/json
      description: Define a new role with a specific name and description.
      parameters:
      - description: Role details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/role.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create New Role
      tags:
      - Roles
  /roles/{id}:
    patch:
      consumes:
      - application/json
      description: Update details (name, description) of an existing role.
      parameters:
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/role.UpdateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update Role
      tags:
      - Roles
  /roles/{id}/permissions:
    get:
      consumes:
      - application/json
      description: Retrieve all permissions assigned to a specific role.
      parameters:
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of permissions
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get Role Permissions
      tags:
      - Roles
    put:
      consumes:
      - application/json
      description: Update the list of permissions assigned to a specific role.
      parameters:
      - description: Role UUID
        in: path
        name: id
        required: true
        type: string
      - description: List of Permission IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/role.UpdateRolePermissionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Assign Permissions to Role
      tags:
      - Roles
  /users:
    get:
      consumes:
      - application/json
      description: Retrieve a list of users with optional filtering (Admin).
      parameters:
      - in: query
        name: endAt
        type: number
      - in: query
        name: hasHourlyWage
        type: boolean
      - in: query
        name: homeStoreId
        type: string
      - collectionFormat: csv
        in: query
        items:
          type: string
        name: ids
        type: array
      - in: query
        name: keyword
        type: string
      - in: query
        name: orderCount
        type: integer
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - in: query
        name: roleSlug
        type: string
      - in: query
        name: startAt
        type: number
      - in: query
        name: tierId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of users
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get All Users
      tags:
      - Users
    post:
      consumes:
      - application/json
      description: Manually create a new user (e.g., for employees or admin accounts).
      parameters:
      - description: User creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.CreateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created user details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create New User (Admin)
      tags:
      - Users
  /users/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve details of a specific user by their ID.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: User details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: User not found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get User by ID
      tags:
      - Users
    patch:
      consumes:
      - application/json
      description: Update a specific user info.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: New User Info
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update User
      tags:
      - Users
  /users/{id}/role:
    patch:
      consumes:
      - application/json
      description: Change the role (permission level) of a specific user.
      parameters:
      - description: User UUID
        in: path
        name: id
        required: true
        type: string
      - description: New Role Slug
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateUserRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated user details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update User Role
      tags:
      - Users
  /users/me:
    get:
      consumes:
      - application/json
      description: Retrieve the profile information of the currently logged-in user.
      produces:
      - application/json
      responses:
        "200":
          description: User profile details
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get My Profile
      tags:
      - Profile
    patch:
      consumes:
      - application/json
      description: Update personal information (Email, Phone, Address, etc.) for the
        logged-in user.
      parameters:
      - description: Updated profile details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.UpdateMeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated profile
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update My Profile
      tags:
      - Profile
  /users/me/avatar:
    delete:
      consumes:
      - application/json
      description: Delete my avatar.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete My Avatar
      tags:
      - Profile
    put:
      consumes:
      - multipart/form-data
      description: Upload my avatar. Supports JPG, PNG, and WebP formats. Max file
        size is 10MB.
      parameters:
      - description: Image file to upload
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request entity too large
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload My Avatar
      tags:
      - Profile
securityDefinitions:
  BearerAuth:
    description: 'Don''t forget to type "Bearer" before the token. For example: Bearer
      eyJhbG...'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
