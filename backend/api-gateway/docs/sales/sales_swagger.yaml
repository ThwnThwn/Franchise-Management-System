info:
  contact:
    email: support@swagger.io
    name: API Support
  description: API docs for CHD Gateway.
  termsOfService: http://swagger.io/terms/
  title: Capital Franchise Supply Chain Management System API Document
  version: "1.0"
paths:
  /me/cart:
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Clear My Cart
      tags:
      - Cart
    get:
      consumes:
      - application/json
      description: Retrieve current user's shopping cart.
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get My Cart
      tags:
      - Cart
  /me/cart/items:
    delete:
      consumes:
      - application/json
      parameters:
      - description: List of Item IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.DeleteCartItemsRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Remove Items from My Cart
      tags:
      - Cart
    post:
      consumes:
      - application/json
      parameters:
      - description: Item details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.UpsertCartItemRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Add Item to My Cart
      tags:
      - Cart
    put:
      consumes:
      - application/json
      parameters:
      - description: Update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.UpsertCartItemRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Update Item in My Cart
      tags:
      - Cart
  /me/orders:
    get:
      consumes:
      - application/json
      description: Retrieve a list of orders placed by the current logged-in customer.
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Llist of user's orders
          schema:
            items:
              $ref: '#/definitions/order.OrderSummary'
            type: array
        "400":
          description: Validation Error (Bad Request)
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get My Order History
      tags:
      - Orders
  /me/orders/payments:
    get:
      description: Retrieve the payment history for the currently logged-in customer.
      parameters:
      - in: query
        name: endDate
        type: string
      - in: query
        name: page
        type: integer
