        bank account number and the processing history.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detailed withdrawal information
          schema:
            $ref: '#/definitions/withdrawal.WithdrawalDetailRes'
        "400":
          description: Invalid UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Withdrawal request not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
