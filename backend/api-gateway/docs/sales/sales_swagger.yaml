        the amount to the user's wallet.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Cancellation reason from Admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.CancelWithdrawalReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Admin đã hủy lệnh và hoàn tiền thành công."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation Error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Cancel withdrawal request (Admin)
      tags:
      - Withdrawals
