      consumes:
      - multipart/form-data
      description: Confirm that the bank transfer was successful. A receipt image
        (receiptFile) must be uploaded as proof.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Transfer receipt image (Bill)
        in: formData
        name: receiptFile
        required: true
        type: file
      - description: Bank transaction ID
        in: formData
        name: bankTransactionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Đã hoàn tất yêu cầu rút tiền và cập nhật bằng
            chứng chuyển khoản."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Missing required file or transaction ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Complete withdrawal request (Admin)
      tags:
      - Withdrawals
  /withdrawals/{id}/reject:
    patch:
      consumes:
      - application/json
      description: Reject a PENDING withdrawal request. The system automatically refunds
        the deducted amount back to the user's wallet.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.RejectWithdrawalReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Đã từ chối yêu cầu rút tiền và hoàn tiền vào
            ví."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation Error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Reject withdrawal request (Admin)
      tags:
      - Withdrawals
securityDefinitions:
  BearerAuth:
    description: 'Don''t forget to type "Bearer" before the token. For example: Bearer
      eyJhbG...'
    in: header
    name: Authorization
    type: apiKey
