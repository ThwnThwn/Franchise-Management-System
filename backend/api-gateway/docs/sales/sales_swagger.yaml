      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Approval notes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.ApproveWithdrawalReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Đã duyệt yêu cầu rút tiền"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation Error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Approve withdrawal request (Admin)
      tags:
      - Withdrawals
