      completedAt:
        type: string
      createdAt:
        type: string
      discountAmount:
        type: number
      id:
        type: string
      items:
        items:
          $ref: '#/definitions/api-gateway_internal_domain_models_supplier.PurchaseOrderItemDetail'
        type: array
      netAmount:
        type: number
      notes:
        type: string
      orderDate:
        type: string
      paidAmount:
        type: number
      paymentStatus:
