syntax = "proto3";

option csharp_namespace = "EngagementService.Grpc.Protos.PointLogGrpc";
option go_package = "api-gateway/pkg/pb/engagement";

import "google/protobuf/timestamp.proto";

package engagement;

service PointLogGrpc {
    rpc GetMyPointLog(GetMyPointLogRequest) returns (GetMyPointLogRep);
}

//Response của log 
message LogResponse{
  string id = 1;
  string user_id = 2;
  string amount = 3;
  string balance_before = 4;
  string balance_after = 5;
  string action_type = 6;
  string reason_code = 7;
  string reference_id = 8;
  string description = 9;
  string expired_at = 10;
  string created_at = 11;
}

message GetMyPointLogRep{
    repeated LogResponse log_res = 1;
    int32 total_count = 2;
    int32 total_pages = 3;
}

message GetMyPointLogRequest{
    optional google.protobuf.Timestamp from_date = 2;
    optional google.protobuf.Timestamp to_date = 3;
    int32 page = 4;
    int32 page_size = 5;
}