syntax = "proto3";

import "google/protobuf/empty.proto";
option go_package = "api-gateway/pkg/pb/sales";

package sales.cart;

service CartItemGrpc {
    rpc AddToCart(AddToCartRequest) returns (CartItemReply);
    rpc UpdateCartItem(UpdateCartItemRequest) returns (CartItemReply);
    rpc DeleteListCartItem(DeleteListCartItemRequest) returns (BoolReply);
    rpc GetCartItems(google.protobuf.Empty) returns (CartItemListReply);

    rpc ClearCart(google.protobuf.Empty) returns (BoolReply);
}

message AddToCartRequest {
  string sku = 1;
  int32 quantity = 2;
}

message UpdateCartItemRequest {
  string sku = 1;
  int32 quantity = 2;
}

message DeleteListCartItemRequest {
  repeated string skus = 1;
}

message CartItemReply {
  string id = 1;
  string sku = 2;
  string productName = 3;
  string imageUrl = 4;
  string attributes = 5;
  string customerId = 6;
  int32 quantity = 7;
  double basePrice = 8;
  string created_at = 9;
  string updated_at = 10;
}

message CartItemListReply {
  repeated CartItemReply items = 1;
}

message BoolReply {
  bool success = 1;
}
