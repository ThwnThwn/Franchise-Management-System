syntax = "proto3";

option go_package = "api-gateway/pkg/pb/calc";
option csharp_namespace = "CalcService.Protos";

package calc;

// Định nghĩa Service
service Calculator {
  rpc Add (AddRequest) returns (AddResponse);
}

// Input
message AddRequest {
  int32 number_a = 1;
  int32 number_b = 2;
}

// Output
message AddResponse {
  int32 result = 1;
}