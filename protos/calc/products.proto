syntax = "proto3";

option csharp_namespace = "ProductService.API";

package product;

service ProductGrpc {
  // Get product list with sizes and prices. Optional filter by categoryId.
  rpc GetProducts (GetProductsRequest) returns (GetProductsReply);

  // Get product details by id.
  rpc GetProductById (GetProductByIdRequest) returns (GetProductByIdReply);
}

message GetProductsRequest {
  // Optional. If empty, returns all categories.
  string category_id = 1;
}

message GetProductsReply {
  repeated Product products = 1;
  int32 total_count = 2;
}

message GetProductByIdRequest {
  string id = 1;
}

message GetProductByIdReply {
  Product product = 1;
}

message Product {
  string id = 1;
  string name = 2;
  string description = 3;
  string image_url = 4;
  bool is_active = 5;
  string category_id = 6;
  string category_name = 7;
  repeated ProductSize sizes = 8;
}

message ProductSize {
  string id = 1;
  string sku = 2;
  string name = 3;
  string attributes = 4;
  double base_price = 5;
  bool is_active = 6;
}

