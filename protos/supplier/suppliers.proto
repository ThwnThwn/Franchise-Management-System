syntax = "proto3";

option csharp_namespace = "SupplierService.Grpc.Protos.Supplier";
option go_package = "api-gateway/pkg/pb/supplier";

package supplier;

service SupplierGrpc {
  // Tạo nhà cung cấp mới
  rpc CreateSupplier(CreateSupplierRequest) returns (CreateSupplierReply);
  // Cập nhật thông tin nhà cung cấp
  rpc UpdateSupplier(UpdateSupplierRequest) returns (UpdateSupplierReply);
  // Xóa mềm nhà cung cấp (soft delete)
  rpc DeleteSupplier(DeleteSupplierRequest) returns (DeleteSupplierReply);
  // Lấy chi tiết 1 nhà cung cấp theo ID
  rpc GetSupplierById(GetSupplierByIdRequest) returns (SupplierDetail);
  // Lấy danh sách nhà cung cấp (phân trang, tìm kiếm)
  rpc GetSuppliers(GetSuppliersRequest) returns (GetSuppliersReply);
}

// ── Requests ──

message CreateSupplierRequest {
  string code = 1;
  string name = 2;
  optional string contact_person = 3;
  optional string phone = 4;
  optional string email = 5;
  optional string address = 6;
  optional string tax_code = 7;
}

message UpdateSupplierRequest {
  string id = 1;
  string code = 2;
  optional string name = 3;
  optional string contact_person = 4;
  optional string phone = 5;
  optional string email = 6;
  optional string address = 7;
  optional string tax_code = 8;
  optional bool is_active = 9;
}

message DeleteSupplierRequest {
  string id = 1;
}

message GetSupplierByIdRequest {
  string id = 1;
}

message GetSuppliersRequest {
  optional string code = 1;         // Tìm theo code
  optional bool is_active = 2;      // Lọc theo trạng thái
  int32 page = 3;
  int32 page_size = 4;
  optional string name = 5;         // Tìm theo tên
}

// ── Replies ──

message CreateSupplierReply {
  string id = 1;
  string code = 2;
  string message = 3;
}

message UpdateSupplierReply {
  string message = 1;
}

message DeleteSupplierReply {
  string message = 1;
}

message GetSuppliersReply {
  repeated SupplierSummary suppliers = 1;
  int32 total_count = 2;
}

message SupplierSummary {
  string id = 1;
  string code = 2;
  string name = 3;
  string contact_person = 4;
  string phone = 5;
  bool is_active = 6;
}

message SupplierDetail {
  string id = 1;
  string code = 2;
  string name = 3;
  string contact_person = 4;
  string phone = 5;
  string email = 6;
  string address = 7;
  string tax_code = 8;
  bool is_active = 9;
  string created_at = 10;
  string updated_at = 11;
}
