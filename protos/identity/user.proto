syntax = "proto3";

option csharp_namespace = "IdentityService.Grpc.Protos.User";
option go_package = "api-gateway/pkg/pb/identity";

package identity.user;

import "identity/role.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

service UserGrpc {
  rpc CustomerCreate(CustomerCreateUserRequest) returns (UserResponse);
  rpc AdminCreate(AdminCreateUserRequest) returns (UserResponse);

  rpc GetById(GetUserByIdRequest) returns (UserResponse);
  rpc GetAll(GetAllUserOrWithRoleRequest) returns (UserListResponse);
  rpc GetManager(GetManagerRequest) returns (UserResponse);


  rpc Update(UpdateUserRequest) returns (UserResponse);
  rpc ChangePassword(ChangePasswordRequest) returns (UserResponse);

  rpc Delete(DeleteUserRequest) returns (DeleteUserResponse);
}

message GetAllUserOrWithRoleRequest{
  string roleSlug = 1;
}

message GetUserByIdRequest {
  string id = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message UserListResponse {
  repeated UserResponse users = 1;
}

message CustomerCreateUserRequest {
  string email = 1;
  string username = 2;
  string phone = 3;
  string address = 4;

  string firstName = 5;
  string lastName = 6;
  optional int32 gender = 7;
  string dateOfBirth = 8;
  string roleSlug = 9;
}

message AdminCreateUserRequest {
  string email = 1;
  string username = 2;
  string phone = 3;
  string address = 4;
  string roleSlug = 5; 
  
  string firstName = 6;
  string lastName = 7;
  optional int32 gender = 8;
  string dateOfBirth =9;
}

message UpdateUserRequest {
  string id = 1;

  string username = 2;
  string email = 3;
  string phone = 4;
  string address = 5;

  string firstName = 6;
  string lastName = 7;
  optional int32 gender = 8;
  string dateOfBirth = 9;

  optional bool isBlocked = 10;
  string roleSlug = 11;
}
message ChangePasswordRequest{
  string id = 1;
  string oldPassword = 2;
  string newPassword = 3;
  string confirmNewPassword = 4;
}

message UserResponse {
  string id = 1;
  string email = 2;
  string username = 3;
  string phone = 4;
  string address = 5;
  bool isBlocked = 6;

  string firstName = 7;
  string lastName = 8;
  int32 gender = 9;
  google.protobuf.Timestamp dateOfBirth = 10;

  identity.role.RoleUserResponse role = 11;
  google.protobuf.Timestamp createdAt = 12;
  google.protobuf.Timestamp updatedAt = 13;
}

message GetManagerRequest{
  string id = 1;
}