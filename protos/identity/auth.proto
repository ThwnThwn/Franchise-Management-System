syntax = "proto3";

option csharp_namespace = "IdentityService.Grpc.Protos.Auth";
option go_package = "api-gateway/pkg/pb/identity";

package identity.auth;

import "identity/user.proto";

service AuthGrpc {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ConfirmOtp (ConfirmOtpRequest) returns (ConfirmOtpResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string phone = 3;
  string address = 4;
}

message RefreshTokenRequest {
  string refreshToken = 1;
}

message LogoutRequest {
  string accessToken = 1;
  string refreshToken = 2;
}

message LogoutResponse {
  bool success = 1;
}

message RegisterResponse {
  string message = 1;
}

message RefreshTokenResponse {
  string accessToken = 1;
  string refreshToken = 2;
}

message LoginResponse {
  string accessToken = 1;
  string refreshToken = 2;
  identity.user.UserResponse user = 3;
}

message ConfirmOtpRequest {
  string email = 1;
  string otp = 2;
}

message ConfirmOtpResponse {
  bool success = 1;
  string message = 2;
}