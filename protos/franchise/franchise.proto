syntax = "proto3";

option csharp_namespace = "FranchiseService.Franchise.Grpc";
option go_package = "api-gateway/pkg/pb/franchise";

package franchise;

import "google/protobuf/timestamp.proto";

// Service quản lý quy trình nhượng quyền của "cà hong bạn"
service FranchiseGrpcService {
    // 1. Khách hàng gửi đơn đăng ký nhượng quyền (truyền bytes ảnh)
    rpc SubmitFranchiseApplication (SubmitApplicationRequest) returns (FranchiseApplicationResponse);
    
    // 2. Admin lấy chi tiết một đơn đăng ký
    rpc GetApplicationDetails (GetApplicationRequest) returns (FranchiseApplicationResponse);

    // 3. Admin lấy danh sách toàn bộ đơn đăng ký (có phân trang và lọc)
    rpc GetAllApplications (GetAllApplicationsRequest) returns (GetAllApplicationsResponse);

    // 4. Admin xử lý đơn (Duyệt hoặc Từ chối)
    rpc ReviewApplication (ReviewFranchiseApplicationRequest) returns (FranchiseApplicationResponse);
}

// --- Messages cho chức năng Submit ---

message SubmitApplicationRequest {
    // Hai trường quan trọng Duy vừa bổ sung vào DB
    string store_id = 1;
    string manager_id = 2;

    string full_name = 3;
    string email = 4;
    string phone = 5;
    string identity_number = 6; 
    string store_address = 7;
    double store_latitude = 8;
    double store_longitude = 9;
    double store_size_sqm = 10;

    bytes land_certificate_data = 11; 
    string land_certificate_filename = 12; 
    
    bytes store_front_data = 13;
    string store_front_filename = 14;
}

// --- Messages cho chức năng Query ---

message GetApplicationRequest {
    string id = 1;
}

message GetAllApplicationsRequest {
    int32 page = 1;
    int32 page_size = 2;   
    optional int32 status = 3; 
    optional string search_key = 4;
}

message GetAllApplicationsResponse {
    repeated FranchiseApplicationResponse applications = 1;
    int32 total_count = 2;   
    int32 total_pages = 3;
    int32 current_page = 4; // Thêm trường này để Frontend dễ quản lý state
}

// --- Messages gộp Duyệt & Từ chối ---

message ReviewFranchiseApplicationRequest {
    string id = 1;
    
    // Action: 1 là Approve (Duyệt), 2 là Reject (Từ chối)
    // Đồng bộ với status (0: Pending, 1: Approved, 2: Rejected)
    int32 action = 2; 
    
    string note = 3;
}

// --- Message Phản hồi chung ---

message FranchiseApplicationResponse {
    string id = 1;
    string store_id = 2;
    string manager_id = 3;
    string full_name = 4;
    string email = 5;
    string phone = 6;
    string identity_number = 7;
    string store_address = 8;
    double store_latitude = 9;
    double store_longitude = 10;
    double store_size_sqm = 11;

    string land_certificate_url = 12;
    string store_front_url = 13;

    int32 status = 14;
    string admin_note = 15;
    
    optional string docuseal_submission_id = 16;
    optional string contract_pdf_url = 17;

    google.protobuf.Timestamp created_at = 18;
    google.protobuf.Timestamp updated_at = 19;
}