syntax = "proto3";

option csharp_namespace = "FranchiseService.API";
option go_package = "api-gateway/pkg/pb/franchise";

package franchise;

service ShiftGrpcService {
  // Lấy lịch làm việc hôm nay của nhân viên (Để App biết đang làm ở Store nào)
  rpc GetUserCurrentShift (GetUserCurrentShiftRequest) returns (GetUserCurrentShiftResponse);
}

// ----------------------------------------------------
// MESSAGES DEFINITION
// ----------------------------------------------------

// --- QUAN TRỌNG CHO APP NHÂN VIÊN/CHẤM CÔNG ---
message GetUserCurrentShiftRequest {
  string user_id = 1;
}

message GetUserCurrentShiftResponse {
  // Trạng thái ca làm
  bool has_shift_today = 1;
  
  // Thông tin định danh (UUID mapping sang string)
  optional string assignment_id = 2;
  optional string shift_id = 3;
  optional string current_log_id = 4;

  // Thông tin Cửa hàng
  string store_id = 5;
  string store_name = 6;
  optional double store_lat = 7;
  optional double store_long = 8;

  // Thời gian ca làm (Format: "HH:mm:ss")
  string start_time = 9;
  string end_time = 10;

  // Logic điều khiển Check-in/out
  bool can_check_in = 11;
  bool can_check_out = 12;
  bool is_overtime = 13;

  // Mốc thời gian ISO 8601 ("2026-02-12T21:00:00Z")
  optional string check_in_at = 14;
  optional string check_out_at = 15;
  string server_time = 16;
}