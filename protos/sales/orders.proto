syntax = "proto3";

option csharp_namespace = "SalesService.API";

package order;

service OrderGrpc {
  // Tạo đơn hàng từ giỏ hàng
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderReply);
  
  // Lấy thông tin đơn hàng theo ID
  rpc GetOrderById (GetOrderByIdRequest) returns (GetOrderByIdReply);

  // Lấy danh sách đơn hàng của khách hàng hiện tại
  rpc GetMyOrders (GetMyOrdersRequest) returns (GetMyOrdersReply);
}

message CreateOrderRequest {
  repeated CartItem items = 1;
  string notes = 2;
  string storeId = 3;
}

message CartItem {
  string sku = 1;
  int32 quantity = 2;
}

message CreateOrderReply {
  string order_id = 1;
  string order_code = 2;
  double total_amount = 3;
  string customer_id = 4;
  CheckEnoughStockResponse check_stock_respone = 5;
}

message GetOrderByIdRequest {
  string id = 1;
}

message GetOrderByIdReply {
  Order order = 1;
}

message Order {
  string id = 1;
  string code = 2;
  double subtotal = 3;
  optional double tax = 4;
  double total_amount = 5;
  double paid_amount = 6;
  optional int32 payment_method = 7;
  optional int32 status = 8;
  string paid_at = 9;
  string notes = 10;
  string created_at = 11;
  string updated_at = 12;
  string customer_id = 13;
  repeated OrderItem items = 14;
}


message OrderItem {
  string id = 1;
  string product_id = 2;
  string variant_id = 3;
  int32 quantity = 4;
  double unit_price = 5;
  string product_name = 6;
  string sku = 7;
  string image_url = 8;
}

message GetMyOrdersRequest {
  optional int32 page = 1;
  optional int32 page_size = 2;
}

message GetMyOrdersReply {
  repeated OrderSummary orders = 1;
  int32 total_count = 2;
}

message OrderSummary {
  string id = 1;
  string code = 2;
  double subtotal = 3;
  optional double tax = 4;
  double total_amount = 5;
  optional double paid_amount = 6;
  optional int32 payment_method = 7;
  optional int32 status = 8;
  string paid_at = 9;
  string notes = 10;
  string created_at = 11;
  string updated_at = 12;
  string customer_id = 13;
}


message CheckEnoughStockResponse {
  bool is_enough = 1;
  repeated ShortageItem shortage_items = 2;
}

message ShortageItem {
  string variant_id = 1;
  int32 max_feasible_quantity = 2;
}