syntax = "proto3";

option csharp_namespace = "InventoryService.Grpc.Protos.Ingredient";
option go_package = "api-gateway/pkg/pb/inventory";

package inventory;

service IngredientGrpc {
  rpc CreateIngredient(CreateIngredientReq) returns (NoneReply);
  rpc UpdateIngredient(UpdateIngredientReq) returns (NoneReply);
  rpc DeleteIngredient(DeleteIngredientReq) returns (NoneReply);
  rpc GetAllIngredient(GetAllIngredientReq) returns (GetAllIngredientRep);
  rpc GetIngredientById(GetIngredientByIdRequest) returns (GetIngredientByIdResponse);
}

message CreateIngredientReq {
    string name = 1;
    string base_unit = 2;
    optional string category_id = 3;
}

message UpdateIngredientReq {
    string id = 1;
    optional string name = 2;
    optional string base_unit = 3;
    optional string category_id = 4;
}

message DeleteIngredientReq {
    string id = 1;
}


message NoneReply {
    // Không trả ra gì (thường dùng để xác nhận rpc thành công)
}

message IngredientViewRes {
    string id = 1;
    string name = 2;
    string base_unit = 3;
    string category_id = 4;
}

message GetAllIngredientRep{
    repeated IngredientViewRes Ingredient_res = 1;
    int32 total_count = 2;
    int32 total_pages = 3;
}

message GetAllIngredientReq{
    optional string category_id = 1;
    int32 page = 2;
    int32 page_size = 3;
}

message GetIngredientByIdRequest{
    string id=1;
}

message GetIngredientByIdResponse{
    IngredientViewRes Ingredient_res = 1;
}
