syntax = "proto3";

option csharp_namespace = "InventoryService.Grpc.Protos.Inventory";
option go_package = "api-gateway/pkg/pb/inventory";

package inventory;

service InventoryGrpc {
  rpc IncreaseStock(IncreaseStockRequest) returns (IncreaseStockResponse);
}

message IncreaseStockRequest {
  string store_id = 1;
  repeated IngredientStockItem items = 2;
}

message IngredientStockItem {
  string ingredient_id = 1;
  double quantity = 2;
}

message IncreaseStockResponse {
 // Không trả ra gì (thường dùng để xác nhận rpc thành công)
}
