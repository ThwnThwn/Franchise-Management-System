info:
  contact:
    email: support@swagger.io
    name: API Support
  description: API docs for CHD Gateway.
  termsOfService: http://swagger.io/terms/
  title: Capital Franchise Supply Chain Management System API Document
  version: "1.0"
paths:
  /franchise/applications:
    get:
      description: Retrieve all franchise applications (supports pagination, filtering
        by status).
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - in: query
        name: searchKey
        type: string
      - in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/franchise.ApplicationPaginationResult'
      security:
      - BearerAuth: []
      summary: Get all franchise applications (Admin)
      tags:
      - 'Franchise: Applications'
    post:
      consumes:
      - multipart/form-data
      description: Partner submits application (personal info, premise address) along
        with storefront and land certificate images.
      parameters:
      - description: Full name
        in: formData
        name: fullName
        required: true
        type: string
      - description: Contact email
        in: formData
        name: email
        required: true
        type: string
      - description: Phone number
        in: formData
        name: phone
        required: true
        type: string
      - description: Identity card number (CMND/CCCD)
        in: formData
        name: identityNumber
        required: true
        type: string
      - description: Province/City ID
        in: formData
        name: provinceId
        required: true
        type: string
      - description: District ID
        in: formData
        name: districtId
        required: true
        type: string
      - description: Ward ID
        in: formData
        name: wardId
        required: true
        type: string
      - description: Proposed store name
        in: formData
        name: storeName
        required: true
        type: string
      - description: Detailed premise address
        in: formData
        name: storeAddress
        required: true
        type: string
      - description: Latitude
        in: formData
        name: storeLatitude
        type: number
      - description: Longitude
        in: formData
        name: storeLongitude
        type: number
      - description: Premise area (sqm)
        in: formData
        name: storeSizeSqm
        type: number
      - description: Storefront image (1 file)
        in: formData
        name: storeFront
        type: file
      - description: Land certificate images (Multiple files)
        in: formData
        name: landCerts
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created application
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_franchise.FranchiseApplicationResponse'
        "400":
          description: Validation error (Bad Request)
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Submit franchise application
      tags:
      - 'Franchise: Applications'
  /franchise/applications/{id}:
    get:
      description: View application details including the list of contracts generated
        from this application.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_franchise.FranchiseApplicationDetailResponse'
      security:
      - BearerAuth: []
      summary: Get application details (Admin)
      tags:
      - 'Franchise: Applications'
  /franchise/applications/{id}/review:
    patch:
      consumes:
      - application/json
      description: Admin approves or rejects the application. If approved, the system
        automatically generates a Contract and sends a DocuSeal link.
      parameters:
      - description: Application ID
        in: path
        name: id
        required: true
        type: string
      - description: Review decision & contract parameters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_franchise.ReviewFranchiseApplicationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_franchise.ReviewApplicationResponse'
      security:
      - BearerAuth: []
      summary: Review franchise application (Admin)
      tags:
      - 'Franchise: Applications'
  /franchise/contracts:
    get:
      description: Retrieve all franchise contracts (supports pagination, filtering
        by status).
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/franchise.ContractPaginationResult'
      security:
      - BearerAuth: []
      summary: Get all contracts (Admin/Accountant)
      tags:
      - 'Franchise: Contracts'
  /franchise/contracts/{id}:
    get:
      description: Retrieve detailed information of a franchise contract.
      parameters:
      - description: Contract ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_franchise.FranchiseContractResponse'
      security:
      - BearerAuth: []
      summary: Get contract details
