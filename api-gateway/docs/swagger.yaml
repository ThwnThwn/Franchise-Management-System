      - Profile
  /users/me/avatar:
    delete:
      consumes:
      - application/json
      description: Delete my avatar.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete My Avatar
      tags:
      - Profile
    put:
      consumes:
      - multipart/form-data
      description: Upload my avatar. Supports JPG, PNG, and WebP formats. Max file
        size is 10MB.
      parameters:
      - description: Image file to upload
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "413":
          description: Request entity too large
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload My Avatar
      tags:
      - Profile
  /variants/{id}/recipes:
    put:
      consumes:
      - application/json
      description: Define or update the list of ingredients (recipe) for a specific
        product variant.
      parameters:
      - description: Variant UUID
        in: path
        name: id
        required: true
        type: string
      - description: List of ingredients and quantities
        in: body
        name: request
        required: true
        schema:
          items:
            $ref: '#/definitions/api-gateway_internal_domain_models_recipe.RecipeIngredientRequest'
          type: array
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update Variant Recipe
      tags:
      - Recipes
  /vnpay/ipn:
    get:
      description: Nhận callback từ VNPay, phân loại đơn hàng và điều phối đến đúng
        Service qua gRPC.
      responses: {}
      summary: VNPay IPN Dispatcher
      tags:
      - Payments
  /vouchers:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all vouchers available in the system.
      produces:
      - application/json
      responses:
        "200":
          description: List of vouchers
          schema:
            items:
              $ref: '#/definitions/api-gateway_internal_domain_models_voucher.VoucherResponse'
            type: array
      summary: Get All Vouchers
      tags:
      - Vouchers
    post:
      consumes:
      - application/json
      description: Create a new discount voucher with items and rules.
      parameters:
      - description: Voucher details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_voucher.CreateVoucherRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create New Voucher
      tags:
      - Vouchers
  /vouchers/{id}:
    delete:
      description: Permanently remove a voucher from the system.
      parameters:
      - description: Voucher UUID
        in: path
        name: id
        required: true
        type: string
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Delete Voucher
      tags:
      - Vouchers
    patch:
      consumes:
      - application/json
      description: Update details of an existing voucher. Fields are optional (patch-like
        behavior).
      parameters:
      - description: Voucher UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated fields
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_voucher.UpdateVoucherRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update Voucher
      tags:
      - Vouchers
  /vouchers/{id}/status:
    patch:
      consumes:
      - application/json
      description: Activate or deactivate a voucher.
      parameters:
      - description: Voucher UUID
        in: path
        name: id
        required: true
        type: string
      - description: New status
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_voucher.UpdateVoucherStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Update Voucher Status
      tags:
      - Vouchers
  /vouchers/code/{code}:
    get:
      consumes:
      - application/json
      description: Retrieve voucher details using its unique string code (e.g., 'SALE50').
      parameters:
      - description: Voucher Code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Voucher details
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_voucher.VoucherResponse'
        "404":
          description: Voucher not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Voucher by Code
      tags:
      - Vouchers
  /wallets/{id}/status:
    patch:
      consumes:
      - application/json
      description: Dành cho Quản trị viên khóa (tạm dừng) hoặc mở khóa ví của người
        dùng.
      parameters:
      - description: UUID của ví cần cập nhật
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin trạng thái mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_wallet.UpdateWalletStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Thông báo cập nhật thành công { message: ''...'' }'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dữ liệu đầu vào hoặc UUID ví không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Chưa đăng nhập
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Không có quyền thao tác (Forbidden)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật trạng thái ví (Admin)
      tags:
      - Wallets
  /wallets/transactions:
    get:
      description: Dành cho Staff, Manager, Admin lấy danh sách giao dịch. Có thể
        truyền thêm `userId` vào query để lọc riêng giao dịch của một người.
      parameters:
      - description: Lọc theo UUID của người dùng cụ thể (Tùy chọn)
        in: query
        name: userId
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách giao dịch
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_common.PaginationResult-api-gateway_internal_domain_models_wallet_WalletTransactionResponse'
        "400":
          description: Tham số không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Chưa đăng nhập
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Không có quyền thao tác
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem toàn bộ giao dịch ví hệ thống
      tags:
      - Wallet Transactions
  /wallets/transactions/{id}:
    get:
      description: Xem chi tiết một giao dịch ví thông qua UUID của giao dịch. Tầng
        service sẽ tự kiểm tra xem `ctxUserId` có quyền xem ID này hay không.
      parameters:
      - description: UUID của giao dịch
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_wallet.WalletTransactionResponse'
        "404":
          description: Không tìm thấy giao dịch
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy chi tiết giao dịch bằng ID
      tags:
      - Wallet Transactions
  /wallets/transactions/code/{code}:
    get:
      description: 'Xem chi tiết một giao dịch ví thông qua mã code (VD: WT-12345).'
      parameters:
      - description: Mã giao dịch (Code)
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_wallet.WalletTransactionResponse'
        "404":
          description: Không tìm thấy giao dịch
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy chi tiết giao dịch bằng Mã giao dịch
      tags:
      - Wallet Transactions
  /wallets/users/{userId}:
    get:
      description: Dành cho Staff, Manager, Admin lấy thông tin ví của một user bất
        kỳ thông qua User ID.
      parameters:
      - description: UUID của người dùng cần xem
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin chi tiết của ví
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_wallet.WalletResponse'
        "400":
          description: ID người dùng không đúng định dạng UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Chưa đăng nhập
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Không có quyền thao tác (Forbidden)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Không tìm thấy ví của người dùng này
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem ví của người dùng
      tags:
      - Wallets
  /wallets/vnpay/return:
    get:
      description: Endpoint hứng callback từ VNPay sau khi khách thanh toán xong.
        Thực hiện xác thực chữ ký gRPC và bẻ lái (redirect) về Frontend kèm theo trạng
        thái giao dịch.
      parameters:
      - description: 'Đường dẫn Frontend muốn bẻ lái về (VD: /my-wallet)'
        in: query
        name: redirectTo
        type: string
      - description: Số tiền giao dịch (nhân 100)
        in: query
        name: vnp_Amount
        type: string
      - description: Mã phản hồi từ VNPay (00 là thành công)
        in: query
        name: vnp_ResponseCode
        type: string
      - description: Mã tham chiếu giao dịch nội bộ
        in: query
        name: vnp_TxnRef
        type: string
      - description: Mã băm bảo mật checksum
        in: query
        name: vnp_SecureHash
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Chuyển hướng (Redirect) về ứng dụng Frontend
      summary: Xử lý Callback VNPay Return (Nạp tiền ví)
      tags:
      - Wallets
  /withdrawals:
    get:
      description: Dành cho quản trị viên xem và lọc danh sách rút tiền của toàn bộ
        người dùng.
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        format: int32
        in: query
        name: status
        type: integer
        x-enum-comments:
          WithdrawalStatusApproved: Đã duyệt
          WithdrawalStatusCancelled: Đã hủy
          WithdrawalStatusCompleted: Thành công
          WithdrawalStatusFailed: Thất bại
          WithdrawalStatusPending: Chờ duyệt
          WithdrawalStatusProcessing: Đang xử lý
          WithdrawalStatusRejected: Từ chối
        x-enum-descriptions:
        - Chờ duyệt
        - Đã duyệt
        - Đang xử lý
        - Thành công
        - Thất bại
        - Từ chối
        - Đã hủy
        x-enum-varnames:
        - WithdrawalStatusPending
        - WithdrawalStatusApproved
        - WithdrawalStatusProcessing
        - WithdrawalStatusCompleted
        - WithdrawalStatusFailed
        - WithdrawalStatusRejected
        - WithdrawalStatusCancelled
      - in: query
        name: userId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách yêu cầu
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_common.PaginationResult-api-gateway_internal_domain_models_withdrawal_WithdrawalSummary'
      security:
      - BearerAuth: []
      summary: Xem toàn bộ danh sách yêu cầu rút tiền (Admin)
      tags:
      - Withdrawals
  /withdrawals/{id}:
    get:
      description: Lấy đầy đủ thông tin một yêu cầu rút tiền bao gồm số tài khoản
        đầy đủ (Raw) và lịch sử xử lý.
      parameters:
      - description: UUID của yêu cầu rút tiền
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_withdrawal.WithdrawalDetailRes'
        "404":
          description: Không tìm thấy
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem chi tiết yêu cầu rút tiền
      tags:
      - Withdrawals
  /withdrawals/{id}/approve:
    patch:
      consumes:
      - application/json
      description: (Admin) Xác nhận yêu cầu hợp lệ và chuẩn bị chuyển tiền. Trạng
        thái chuyển sang APPROVED.
      parameters:
      - description: UUID của yêu cầu rút tiền
        in: path
        name: id
        required: true
        type: string
      - description: Ghi chú duyệt
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_withdrawal.ApproveWithdrawalReq'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Duyệt yêu cầu rút tiền
      tags:
      - Withdrawals
  /withdrawals/{id}/cancel:
    patch:
      description: Dùng để hủy lệnh ở bất kỳ giai đoạn nào (Pending, Approved, Processing)
        TRỪ KHI đã thành công/hủy rồi. Hệ thống tự hoàn tiền vào ví.
      parameters:
      - description: ID yêu cầu
        in: path
        name: id
        required: true
        type: string
      - description: Lý do hủy từ Admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_withdrawal.CancelWithdrawalReq'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Admin hủy yêu cầu (Dành cho hầu hết trạng thái)
      tags:
      - Withdrawals
  /withdrawals/{id}/complete:
    patch:
      consumes:
      - multipart/form-data
      description: (Admin) Xác nhận đã chuyển khoản thành công. Phải upload ảnh bill
        (receiptFile) để minh chứng.
      parameters:
      - description: UUID của yêu cầu rút tiền
        in: path
        name: id
        required: true
        type: string
      - description: Ảnh chụp biên lai chuyển khoản (Bill)
        in: formData
        name: receiptFile
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: Hoàn tất
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hoàn tất yêu cầu rút tiền (Kèm hóa đơn)
      tags:
      - Withdrawals
  /withdrawals/{id}/reject:
    patch:
      description: Dùng để từ chối lệnh khi đang PENDING. Hệ thống tự hoàn tiền vào
        ví.
      parameters:
      - description: ID yêu cầu
        in: path
        name: id
        required: true
        type: string
      - description: Lý do từ chối
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_withdrawal.RejectWithdrawalReq'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Admin từ chối yêu cầu (Chỉ dành cho lệnh PENDING)
      tags:
      - Withdrawals
securityDefinitions:
  BearerAuth:
    description: 'Don''t forget to type "Bearer" before the token. For example: Bearer
      eyJhbG...'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
