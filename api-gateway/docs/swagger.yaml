host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: API docs for CHD Gateway.
  termsOfService: http://swagger.io/terms/
  title: API Gateway Documentation
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows the logged-in user to change their password. Requires a
        valid Access Token.
      parameters:
      - description: Old and New Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_user.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized or missing token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change Password
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates the password reset process by sending an OTP to the provided
        email address.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request Password Reset
      tags:
      - Auth
  /auth/forgot-password/confirm-otp:
    post:
      consumes:
      - application/json
      description: Verifies the OTP sent to the email. If successful, a 'forgot_password_token'
        HttpOnly cookie will be set, which is required for setting the new password.
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.ConfirmOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message and sets cookie
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Password Reset OTP
      tags:
      - Auth
  /auth/forgot-password/new-password:
    post:
      consumes:
      - application/json
      description: Finalizes the password reset process. This endpoint requires the
        'forgot_password_token' cookie obtained from the OTP verification step.
      parameters:
      - description: New Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.NewPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing cookie or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set New Password
      tags:
      - Auth
  /auth/forgot-password/resend-otp:
    post:
      consumes:
      - application/json
      description: Resends the OTP for password reset if the previous one expired.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend Password Reset OTP
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Enter username/email and password to get access token
      parameters:
      - description: Login Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the current access token and clears the refresh token
        cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
