            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new account
      tags:
      - Auth
  /auth/register/confirm-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP sent to email to activate the new account.
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.ConfirmOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status and message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Registration OTP
      tags:
      - Auth
  /auth/register/resend-otp:
    post:
      consumes:
      - application/json
      description: Resend the activation OTP if the previous one expired or was not
        received.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
