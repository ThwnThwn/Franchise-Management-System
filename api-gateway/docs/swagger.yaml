host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: API docs for CHD Gateway.
  termsOfService: http://swagger.io/terms/
  title: API Gateway Documentation
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows the logged-in user to change their password. Requires a
        valid Access Token.
      parameters:
      - description: Old and New Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_user.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized or missing token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change Password
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates the password reset process by sending an OTP to the provided
        email address.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request Password Reset
      tags:
      - Auth
  /auth/forgot-password/confirm-otp:
    post:
      consumes:
      - application/json
      description: Verifies the OTP sent to the email. If successful, a 'forgot_password_token'
        HttpOnly cookie will be set, which is required for setting the new password.
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.ConfirmOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message and sets cookie
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Password Reset OTP
      tags:
      - Auth
  /auth/forgot-password/new-password:
    post:
      consumes:
      - application/json
      description: Finalizes the password reset process. This endpoint requires the
        'forgot_password_token' cookie obtained from the OTP verification step.
      parameters:
      - description: New Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.NewPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing cookie or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set New Password
      tags:
      - Auth
  /auth/forgot-password/resend-otp:
    post:
      consumes:
      - application/json
      description: Resends the OTP for password reset if the previous one expired.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend Password Reset OTP
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Enter username/email and password to get access token
      parameters:
      - description: Login Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the current access token and clears the refresh token
        cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Obtains a new access token using the valid refresh token stored
        in the HttpOnly cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Returns new Access Token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing cookie
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh Access Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account. After successful registration, an OTP
        will be sent to the email for verification.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new account
      tags:
      - Auth
  /auth/register/confirm-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP sent to email to activate the new account.
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.ConfirmOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status and message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Registration OTP
      tags:
      - Auth
  /auth/register/resend-otp:
    post:
      consumes:
      - application/json
      description: Resend the activation OTP if the previous one expired or was not
        received.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend Registration OTP
      tags:
      - Auth
  /categories:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all available product categories.
      produces:
      - application/json
      responses:
        "200":
          description: List of categories
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get All Categories
      tags:
      - Categories
    post:
      consumes:
      - application/json
      description: Create a new product category.
      parameters:
      - description: Category details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_category.CreateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Category
      tags:
      - Categories
  /categories/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently delete a category by its ID.
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Delete Category
      tags:
      - Categories
    get:
      consumes:
      - application/json
      description: Retrieve details of a specific category using its UUID.
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Category details
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid ID format
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Category not found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get Category by ID
      tags:
      - Categories
    patch:
      consumes:
      - application/json
      description: Update an existing category by its ID.
      parameters:
      - description: Category UUID
        in: path
        name: id
        required: true
        type: string
      - description: Updated details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_category.UpdateCategoryReq'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update Category
      tags:
      - Categories
  /ingredients:
    get:
      consumes:
      - application/json
      description: Retrieve a list of ingredients with optional filtering and pagination.
      parameters:
      - in: query
        name: categoryId
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of ingredients
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get All Ingredients
      tags:
      - Ingredients
    post:
      consumes:
      - application/json
      description: Add a new ingredient to the inventory.
      parameters:
      - description: Ingredient details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api-gateway_internal_domain_models_ingredient.CreateIngredientReq'
      produces:
      - application/json
      responses:
        "200":
          description: Success
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create Ingredient
      tags:
      - Ingredients
  /ingredients/{id}:
    delete:
      consumes:
