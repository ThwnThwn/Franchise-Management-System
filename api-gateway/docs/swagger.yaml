  /orders/reports/sales-trend:
    get:
      consumes:
      - application/json
      description: |-
        Lấy dữ liệu xu hướng doanh thu (doanh thu, lượng đơn hàng) trong một khoảng thời gian được gom nhóm (giờ/ngày/tuần).
        LƯU Ý VỀ PHÂN QUYỀN (StoreId):
        - Nếu là Admin: Có thể truyền tham số storeId để xem cụ thể một cửa hàng, hoặc không truyền (bỏ trống) để xem dữ liệu của toàn hệ thống.
        - Nếu là Manager/Staff: Truyền storeId hay không thì hệ thống cũng sẽ tự động ghi đè (override) bằng ID cửa hàng của tài khoản đang đăng nhập.
      parameters:
      - default: 1
        description: Mức độ gom nhóm dữ liệu. 0 = Hour, 1 = Day, 2 = Week.
        enum:
        - 0
        - 1
        - 2
        example: 1
        in: query
        name: aggregation
        type: integer
      - description: ID Danh mục sản phẩm (Tùy chọn)
        example: cat-001
        in: query
        name: categoryId
        type: string
      - description: Thời gian bắt đầu. Bắt buộc nhập.
        example: "2024-03-01T00:00:00Z"
        in: query
        name: fromDate
        required: true
        type: string
      - description: ID Cửa hàng (Tùy chọn)
        example: 123e4567-e89b-12d3-a456-426614174000
        in: query
        name: storeId
        type: string
      - description: Thời gian kết thúc. Bắt buộc nhập.
        example: "2024-03-05T23:59:59Z"
        in: query
        name: toDate
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Dữ liệu xu hướng và nhãn thời gian cao điểm/thấp điểm
          schema:
            $ref: '#/definitions/api-gateway_internal_domain_models_order.GetSalesTrendReply'
        "400":
          description: Lỗi dữ liệu đầu vào (Bad Request)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Lỗi xác thực (Unauthorized)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy biểu đồ xu hướng doanh thu
      tags:
      - Orders
