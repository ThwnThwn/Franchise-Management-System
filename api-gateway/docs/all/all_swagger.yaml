info:
  contact:
    email: support@swagger.io
    name: API Support
  description: API docs for CHD Gateway.
  termsOfService: http://swagger.io/terms/
  title: Capital Franchise Supply Chain Management System API Document
  version: "1.0"
paths:
  /auth/change-password:
    post:
      consumes:
      - application/json
      description: Allows the logged-in user to change their password. Requires a
        valid Access Token.
      parameters:
      - description: Old and New Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/user.ChangePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized or missing token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Change Password
      tags:
      - Auth
  /auth/forgot-password:
    post:
      consumes:
      - application/json
      description: Initiates the password reset process by sending an OTP to the provided
        email address.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Request Password Reset
      tags:
      - Auth
  /auth/forgot-password/confirm-otp:
    post:
      consumes:
      - application/json
      description: Verifies the OTP sent to the email. If successful, a 'forgot_password_token'
        HttpOnly cookie will be set, which is required for setting the new password.
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ConfirmOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message and sets cookie
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Password Reset OTP
      tags:
      - Auth
  /auth/forgot-password/new-password:
    post:
      consumes:
      - application/json
      description: Finalizes the password reset process. This endpoint requires the
        'forgot_password_token' cookie obtained from the OTP verification step.
      parameters:
      - description: New Password
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.NewPasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing cookie or validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid or expired token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Set New Password
      tags:
      - Auth
  /auth/forgot-password/resend-otp:
    post:
      consumes:
      - application/json
      description: Resends the OTP for password reset if the previous one expired.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend Password Reset OTP
      tags:
      - Auth
  /auth/login:
    post:
      consumes:
      - application/json
      description: Enter username/email and password to get access token
      parameters:
      - description: Login Request Body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Login
      tags:
      - Auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: Invalidates the current access token and clears the refresh token
        cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized or invalid token
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/refresh-token:
    post:
      consumes:
      - application/json
      description: Obtains a new access token using the valid refresh token stored
        in the HttpOnly cookie.
      produces:
      - application/json
      responses:
        "200":
          description: Returns new Access Token
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Missing cookie
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Invalid refresh token
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh Access Token
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account. After successful registration, an OTP
        will be sent to the email for verification.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Register a new account
      tags:
      - Auth
  /auth/register/confirm-otp:
    post:
      consumes:
      - application/json
      description: Verify the OTP sent to email to activate the new account.
      parameters:
      - description: Email and OTP
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.ConfirmOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success status and message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid OTP or validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Verify Registration OTP
      tags:
      - Auth
  /auth/register/resend-otp:
    post:
      consumes:
      - application/json
      description: Resend the activation OTP if the previous one expired or was not
        received.
      parameters:
      - description: Email address
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendOtpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Returns success message
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Validation error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Resend Registration OTP
      tags:
      - Auth
  /campaigns:
    get:
      description: Retrieve a list of all existing campaigns / promotional programs
        in the system.
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách chiến dịch thành công
          schema:
            items:
              $ref: '#/definitions/campaign.CampaignResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Get all campaigns
      tags:
      - Campaigns
    post:
      consumes:
      - application/json
      description: Create a new campaign or voucher hunting event.
      parameters:
      - description: Campaign initialization data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/campaign.CreateCampaignRequest'
      produces:
      - application/json
      responses:
        "201":
          description: '{"message": "Tạo chiến dịch thành công"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation Error (Bad Request)
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Create a new campaign
      tags:
      - Campaigns
  /campaigns/{id}:
    get:
      description: Retrieve detailed information of a specific campaign by its ID.
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Chi tiết chiến dịch
          schema:
            $ref: '#/definitions/campaign.CampaignResponse'
        "400":
          description: Invalid ID (Bad Request)
          schema:
            type: object
        "404":
          description: Campaign Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Get campaign details
      tags:
      - Campaigns
  /campaigns/{id}/active:
    patch:
      consumes:
      - application/json
      description: Enable or disable the active status of a specific campaign.
      parameters:
      - description: Campaign ID
        in: path
        name: id
        required: true
        type: string
      - description: Status update data
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/campaign.UpdateActiveStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Cập nhật trạng thái chiến dịch thành công"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid input data or ID
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Campaign Not Found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Update campaign active status
      tags:
      - Campaigns
  /campaigns/active:
    get:
      description: Retrieve a list of currently active campaigns / promotional programs.
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách chiến dịch
          schema:
            items:
              $ref: '#/definitions/campaign.CampaignResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: object
      summary: Get active campaigns
      tags:
      - Campaigns
  /campaigns/vouchers/{voucherId}/redeem:
    post:
      consumes:
      - application/json
      description: User redeems points for a voucher or claims a free voucher from
        a specific campaign.
      parameters:
      - description: Voucher ID
        in: path
        name: voucherId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Đổi thành công!"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Invalid ID or bad request data
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "403":
          description: Insufficient points or Forbidden
          schema:
            type: object
        "404":
          description: Campaign or voucher not found
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Redeem voucher from campaign
      tags:
      - Campaigns
  /categories:
    get:
      consumes:
      - application/json
      description: Retrieve a list of all available product categories.
      produces:
      - application/json
      responses:
        "200":
          description: List of categories
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get All Categories
      tags:
