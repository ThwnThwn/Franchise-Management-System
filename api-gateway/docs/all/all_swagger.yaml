            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Transaction not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get transaction details by Code
      tags:
      - Wallet Transactions
  /wallets/users/{userId}:
    get:
      description: Intended for Staff, Manager, or Admin to retrieve wallet information
        of a specific user by their User ID.
      parameters:
      - description: Target User UUID
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detailed wallet information
          schema:
            $ref: '#/definitions/wallet.WalletResponse'
        "400":
          description: Invalid User UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden (Insufficient permissions)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Wallet not found for this user
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get user wallet details (Admin)
      tags:
      - Wallets
  /wallets/vnpay/return:
    get:
      description: Callback endpoint for VNPay after a customer completes a wallet
        top-up payment. Validates the gRPC signature and redirects the user to the
        Frontend UI with the transaction status.
      parameters:
      - description: Frontend path to redirect to (e.g., /my-wallet)
        in: query
        name: redirectTo
        type: string
      - description: Transaction Amount (multiplied by 100)
        in: query
        name: vnp_Amount
        type: string
      - description: VNPay Response Code (00 means success)
        in: query
        name: vnp_ResponseCode
        type: string
      - description: Internal Transaction Reference
        in: query
        name: vnp_TxnRef
        type: string
      - description: Checksum Security Hash
        in: query
        name: vnp_SecureHash
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Redirects to the Frontend application
      summary: Handle VNPay Return URL (Wallet Top-up)
      tags:
      - Wallets
  /withdrawals:
    get:
      description: Intended for administrators and accountants to view and filter
        the withdrawal requests of all users across the system.
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        format: int32
        in: query
        name: status
        type: integer
        x-enum-comments:
          WithdrawalStatusApproved: Đã duyệt
          WithdrawalStatusCancelled: Đã hủy
          WithdrawalStatusCompleted: Thành công
          WithdrawalStatusFailed: Thất bại
          WithdrawalStatusPending: Chờ duyệt
          WithdrawalStatusProcessing: Đang xử lý
          WithdrawalStatusRejected: Từ chối
        x-enum-descriptions:
        - Chờ duyệt
        - Đã duyệt
        - Đang xử lý
        - Thành công
        - Thất bại
        - Từ chối
        - Đã hủy
        x-enum-varnames:
        - WithdrawalStatusPending
        - WithdrawalStatusApproved
        - WithdrawalStatusProcessing
        - WithdrawalStatusCompleted
        - WithdrawalStatusFailed
        - WithdrawalStatusRejected
        - WithdrawalStatusCancelled
      - in: query
        name: userId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: List of system withdrawal requests
          schema:
            $ref: '#/definitions/common.PaginationResult-withdrawal_WithdrawalSummary'
        "400":
          description: Validation Error (Bad Request)
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get all withdrawal requests (Admin)
      tags:
      - Withdrawals
  /withdrawals/{id}:
    get:
      description: Retrieve full details of a withdrawal request, including the raw
        bank account number and the processing history.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Detailed withdrawal information
          schema:
            $ref: '#/definitions/withdrawal.WithdrawalDetailRes'
        "400":
          description: Invalid UUID format
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "404":
          description: Withdrawal request not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Get withdrawal request details
      tags:
      - Withdrawals
  /withdrawals/{id}/approve:
    patch:
      consumes:
      - application/json
      description: Confirm that the request is valid and prepare for the fund transfer.
        The status changes to APPROVED.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Approval notes
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.ApproveWithdrawalReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Đã duyệt yêu cầu rút tiền"}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation Error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Approve withdrawal request (Admin)
      tags:
      - Withdrawals
  /withdrawals/{id}/cancel:
    patch:
      consumes:
      - application/json
      description: Cancel a withdrawal request at any stage (Pending, Approved, Processing)
        UNLESS it is already completed or cancelled. The system automatically refunds
        the amount to the user's wallet.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Cancellation reason from Admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.CancelWithdrawalReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Admin đã hủy lệnh và hoàn tiền thành công."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation Error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Cancel withdrawal request (Admin)
      tags:
      - Withdrawals
  /withdrawals/{id}/complete:
    patch:
      consumes:
      - multipart/form-data
      description: Confirm that the bank transfer was successful. A receipt image
        (receiptFile) must be uploaded as proof.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Transfer receipt image (Bill)
        in: formData
        name: receiptFile
        required: true
        type: file
      - description: Bank transaction ID
        in: formData
        name: bankTransactionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Đã hoàn tất yêu cầu rút tiền và cập nhật bằng
            chứng chuyển khoản."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Missing required file or transaction ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Complete withdrawal request (Admin)
      tags:
      - Withdrawals
  /withdrawals/{id}/reject:
    patch:
      consumes:
      - application/json
      description: Reject a PENDING withdrawal request. The system automatically refunds
        the deducted amount back to the user's wallet.
      parameters:
      - description: Withdrawal request UUID
        in: path
        name: id
        required: true
        type: string
      - description: Rejection reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.RejectWithdrawalReq'
      produces:
      - application/json
      responses:
        "200":
          description: '{"message": "Đã từ chối yêu cầu rút tiền và hoàn tiền vào
            ví."}'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Validation Error or Invalid ID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            type: object
        "500":
          description: Internal Server Error
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Reject withdrawal request (Admin)
      tags:
      - Withdrawals
securityDefinitions:
  BearerAuth:
    description: 'Don''t forget to type "Bearer" before the token. For example: Bearer
      eyJhbG...'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
