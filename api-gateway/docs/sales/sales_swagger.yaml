          schema:
            $ref: '#/definitions/wallet.RefundTicketDetail'
        "404":
          description: Không tìm thấy ticket
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem chi tiết một yêu cầu hoàn tiền
      tags:
      - Refunds
  /refunds/{id}/approve:
    patch:
      consumes:
      - application/json
      description: (Admin) Chấp nhận và tiến hành hoàn tiền cho khách.
      parameters:
      - description: UUID của ticket hoàn tiền
        in: path
        name: id
        required: true
        type: string
      - description: Lý do duyệt
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.ApproveRefundRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Duyệt yêu cầu hoàn tiền
      tags:
      - Refunds
  /refunds/{id}/cancel:
    patch:
      consumes:
      - application/json
      description: (Customer/Admin) Hủy bỏ ticket hoàn tiền (thường do khách hàng
        đổi ý).
      parameters:
      - description: UUID của ticket hoàn tiền
        in: path
        name: id
        required: true
        type: string
      - description: Lý do hủy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.CancelRefundRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hủy yêu cầu hoàn tiền
      tags:
      - Refunds
  /refunds/{id}/complete:
    patch:
      consumes:
      - application/json
      description: (Staff/Manager/Admin) Xác nhận quá trình chuyển tiền đã xong, đóng
        ticket.
      parameters:
      - description: UUID của ticket hoàn tiền
        in: path
        name: id
        required: true
        type: string
      - description: Ghi chú hoàn tất
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.SetCompleteRefundRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Đánh dấu hoàn tất hoàn tiền
      tags:
      - Refunds
  /refunds/{id}/reject:
    patch:
      consumes:
      - application/json
      description: (Admin) Từ chối yêu cầu hoàn tiền kèm theo lý do cụ thể.
      parameters:
      - description: UUID của ticket hoàn tiền
        in: path
        name: id
        required: true
        type: string
      - description: Lý do từ chối
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.RejectRefundRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Từ chối yêu cầu hoàn tiền
      tags:
      - Refunds
  /wallets/{id}/status:
    patch:
      consumes:
      - application/json
      description: Dành cho Quản trị viên khóa (tạm dừng) hoặc mở khóa ví của người
        dùng.
      parameters:
      - description: UUID của ví cần cập nhật
        in: path
        name: id
        required: true
        type: string
      - description: Thông tin trạng thái mới
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.UpdateWalletStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Thông báo cập nhật thành công { message: ''...'' }'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dữ liệu đầu vào hoặc UUID ví không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Chưa đăng nhập
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Không có quyền thao tác (Forbidden)
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Cập nhật trạng thái ví (Admin)
      tags:
      - Wallets
  /wallets/transactions:
    get:
      description: Dành cho Staff, Manager, Admin lấy danh sách giao dịch. Có thể
        truyền thêm `userId` vào query để lọc riêng giao dịch của một người.
      parameters:
      - description: Lọc theo UUID của người dùng cụ thể (Tùy chọn)
        in: query
        name: userId
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách giao dịch
          schema:
            $ref: '#/definitions/common.PaginationResult-wallet_WalletTransactionResponse'
        "400":
          description: Tham số không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Chưa đăng nhập
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Không có quyền thao tác
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem toàn bộ giao dịch ví hệ thống
      tags:
      - Wallet Transactions
  /wallets/transactions/{id}:
    get:
      description: Xem chi tiết một giao dịch ví thông qua UUID của giao dịch. Tầng
        service sẽ tự kiểm tra xem `ctxUserId` có quyền xem ID này hay không.
      parameters:
      - description: UUID của giao dịch
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet.WalletTransactionResponse'
        "404":
          description: Không tìm thấy giao dịch
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy chi tiết giao dịch bằng ID
      tags:
      - Wallet Transactions
  /wallets/transactions/code/{code}:
    get:
      description: 'Xem chi tiết một giao dịch ví thông qua mã code (VD: WT-12345).'
      parameters:
      - description: Mã giao dịch (Code)
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/wallet.WalletTransactionResponse'
        "404":
          description: Không tìm thấy giao dịch
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Lấy chi tiết giao dịch bằng Mã giao dịch
      tags:
      - Wallet Transactions
  /wallets/users/{userId}:
    get:
      description: Dành cho Staff, Manager, Admin lấy thông tin ví của một user bất
        kỳ thông qua User ID.
      parameters:
      - description: UUID của người dùng cần xem
        in: path
        name: userId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin chi tiết của ví
          schema:
            $ref: '#/definitions/wallet.WalletResponse'
        "400":
          description: ID người dùng không đúng định dạng UUID
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Chưa đăng nhập
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Không có quyền thao tác (Forbidden)
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Không tìm thấy ví của người dùng này
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem ví của người dùng
      tags:
      - Wallets
  /wallets/vnpay/return:
    get:
      description: Endpoint hứng callback từ VNPay sau khi khách thanh toán xong.
        Thực hiện xác thực chữ ký gRPC và bẻ lái (redirect) về Frontend kèm theo trạng
        thái giao dịch.
      parameters:
      - description: 'Đường dẫn Frontend muốn bẻ lái về (VD: /my-wallet)'
        in: query
        name: redirectTo
        type: string
      - description: Số tiền giao dịch (nhân 100)
        in: query
        name: vnp_Amount
        type: string
      - description: Mã phản hồi từ VNPay (00 là thành công)
        in: query
        name: vnp_ResponseCode
        type: string
      - description: Mã tham chiếu giao dịch nội bộ
        in: query
        name: vnp_TxnRef
        type: string
      - description: Mã băm bảo mật checksum
        in: query
        name: vnp_SecureHash
        type: string
      produces:
      - text/html
      responses:
        "302":
          description: Chuyển hướng (Redirect) về ứng dụng Frontend
      summary: Xử lý Callback VNPay Return (Nạp tiền ví)
      tags:
      - Wallets
  /withdrawals:
    get:
      description: Dành cho quản trị viên xem và lọc danh sách rút tiền của toàn bộ
        người dùng.
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        format: int32
        in: query
        name: status
        type: integer
        x-enum-comments:
          WithdrawalStatusApproved: Đã duyệt
          WithdrawalStatusCancelled: Đã hủy
          WithdrawalStatusCompleted: Thành công
          WithdrawalStatusFailed: Thất bại
          WithdrawalStatusPending: Chờ duyệt
          WithdrawalStatusProcessing: Đang xử lý
          WithdrawalStatusRejected: Từ chối
        x-enum-descriptions:
        - Chờ duyệt
        - Đã duyệt
        - Đang xử lý
        - Thành công
        - Thất bại
        - Từ chối
        - Đã hủy
        x-enum-varnames:
        - WithdrawalStatusPending
        - WithdrawalStatusApproved
        - WithdrawalStatusProcessing
        - WithdrawalStatusCompleted
        - WithdrawalStatusFailed
        - WithdrawalStatusRejected
        - WithdrawalStatusCancelled
      - in: query
        name: userId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách yêu cầu
          schema:
            $ref: '#/definitions/common.PaginationResult-withdrawal_WithdrawalSummary'
      security:
      - BearerAuth: []
      summary: Xem toàn bộ danh sách yêu cầu rút tiền (Admin)
      tags:
      - Withdrawals
  /withdrawals/{id}:
    get:
      description: Lấy đầy đủ thông tin một yêu cầu rút tiền bao gồm số tài khoản
        đầy đủ (Raw) và lịch sử xử lý.
      parameters:
      - description: UUID của yêu cầu rút tiền
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/withdrawal.WithdrawalDetailRes'
        "404":
          description: Không tìm thấy
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem chi tiết yêu cầu rút tiền
      tags:
      - Withdrawals
  /withdrawals/{id}/approve:
    patch:
      consumes:
      - application/json
      description: (Admin) Xác nhận yêu cầu hợp lệ và chuẩn bị chuyển tiền. Trạng
        thái chuyển sang APPROVED.
      parameters:
      - description: UUID của yêu cầu rút tiền
        in: path
        name: id
        required: true
        type: string
      - description: Ghi chú duyệt
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.ApproveWithdrawalReq'
      produces:
      - application/json
      responses:
        "200":
          description: Thành công
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Duyệt yêu cầu rút tiền
      tags:
      - Withdrawals
  /withdrawals/{id}/cancel:
    patch:
      description: Dùng để hủy lệnh ở bất kỳ giai đoạn nào (Pending, Approved, Processing)
        TRỪ KHI đã thành công/hủy rồi. Hệ thống tự hoàn tiền vào ví.
      parameters:
      - description: ID yêu cầu
        in: path
        name: id
        required: true
        type: string
      - description: Lý do hủy từ Admin
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.CancelWithdrawalReq'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Admin hủy yêu cầu (Dành cho hầu hết trạng thái)
      tags:
      - Withdrawals
  /withdrawals/{id}/complete:
    patch:
      consumes:
      - multipart/form-data
      description: (Admin) Xác nhận đã chuyển khoản thành công. Phải upload ảnh bill
        (receiptFile) để minh chứng.
      parameters:
      - description: UUID của yêu cầu rút tiền
        in: path
        name: id
        required: true
        type: string
      - description: Ảnh chụp biên lai chuyển khoản (Bill)
        in: formData
        name: receiptFile
        required: true
        type: file
      - description: Mã giao dịch
        in: formData
        name: bankTransactionId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Hoàn tất
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Hoàn tất yêu cầu rút tiền (Kèm hóa đơn)
      tags:
      - Withdrawals
  /withdrawals/{id}/reject:
    patch:
      description: Dùng để từ chối lệnh khi đang PENDING. Hệ thống tự hoàn tiền vào
        ví.
      parameters:
      - description: ID yêu cầu
        in: path
        name: id
        required: true
        type: string
      - description: Lý do từ chối
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/withdrawal.RejectWithdrawalReq'
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Admin từ chối yêu cầu (Chỉ dành cho lệnh PENDING)
      tags:
      - Withdrawals
securityDefinitions:
  BearerAuth:
    description: 'Don''t forget to type "Bearer" before the token. For example: Bearer
      eyJhbG...'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
