host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: API Support
  description: API docs for CHD Gateway.
  termsOfService: http://swagger.io/terms/
  title: API Gateway Documentation
  version: "1.0"
paths:
  /me/cart:
    delete:
      consumes:
      - application/json
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Clear My Cart
      tags:
      - Cart
    get:
      consumes:
      - application/json
      description: Retrieve current user's shopping cart.
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Get My Cart
      tags:
      - Cart
  /me/cart/items:
    delete:
      consumes:
      - application/json
      parameters:
      - description: List of Item IDs
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.DeleteCartItemsRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Remove Items from My Cart
      tags:
      - Cart
    post:
      consumes:
      - application/json
      parameters:
      - description: Item details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.UpsertCartItemRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Add Item to My Cart
      tags:
      - Cart
    put:
      consumes:
      - application/json
      parameters:
      - description: Update details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/cart.UpsertCartItemRequest'
      produces:
      - application/json
      responses: {}
      security:
      - BearerAuth: []
      summary: Update Item in My Cart
      tags:
      - Cart
  /me/orders:
    get:
      consumes:
      - application/json
      description: Retrieve a list of orders placed by the current logged-in user
        with optional filtering.
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of orders
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get My Order History
      tags:
      - Orders
  /me/orders/payments:
    get:
      description: Khách hàng tự xem lại lịch sử các đợt thanh toán đơn hàng của chính
        mình.
      parameters:
      - in: query
        name: endDate
        type: string
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - description: ISO-8601
        in: query
        name: startDate
        type: string
      - description: 0=Pending, 1=Paid, 2=Failed; omit for all
        in: query
        name: status
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/common.PaginationResult-order_PaymentHistoryItem'
      security:
      - BearerAuth: []
      summary: Lịch sử thanh toán của tôi (Customer)
      tags:
      - Orders
  /me/refunds:
    get:
      description: Lấy danh sách các ticket hoàn tiền do chính user đang đăng nhập
        tạo (có phân trang).
      parameters:
      - in: query
        name: page
        type: integer
      - in: query
        name: pageSize
        type: integer
      - enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        format: int32
        in: query
        name: status
        type: integer
        x-enum-varnames:
        - RefundTicketStatus_REFUND_STATUS_PENDING
        - RefundTicketStatus_REFUND_STATUS_APPROVED
        - RefundTicketStatus_REFUND_STATUS_PROCESSING
        - RefundTicketStatus_REFUND_STATUS_COMPLETED
        - RefundTicketStatus_REFUND_STATUS_FAILED
        - RefundTicketStatus_REFUND_STATUS_REJECTED
        - RefundTicketStatus_REFUND_STATUS_CANCELLED
      produces:
      - application/json
      responses:
        "200":
          description: Danh sách ticket
          schema:
            $ref: '#/definitions/common.PaginationResult-wallet_RefundTicketSummary'
        "400":
          description: Tham số không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Chưa đăng nhập
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem danh sách yêu cầu hoàn tiền của tôi
      tags:
      - Refunds
    post:
      consumes:
      - application/json
      description: Khách hàng chủ động tạo một yêu cầu hoàn tiền (ticket) cho một
        giao dịch/đơn hàng.
      parameters:
      - description: Thông tin yêu cầu hoàn tiền
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.CreateRefundByCustomerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Tạo thành công
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dữ liệu đầu vào không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Tạo yêu cầu hoàn tiền mới
      tags:
      - Refunds
  /me/wallet:
    get:
      description: Lấy thông tin ví và số dư hiện tại của người dùng đang đăng nhập.
      produces:
      - application/json
      responses:
        "200":
          description: Thông tin chi tiết của ví
          schema:
            $ref: '#/definitions/wallet.WalletResponse'
        "401":
          description: Chưa đăng nhập hoặc token không hợp lệ
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Lỗi hệ thống nội bộ
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Xem ví cá nhân
      tags:
      - Wallets
  /me/wallet/top-up:
    post:
      consumes:
      - application/json
      description: Tạo link thanh toán qua cổng VNPay để người dùng nạp tiền vào ví
        cá nhân.
      parameters:
      - description: 'Thông tin nạp tiền (VD: số tiền)'
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/wallet.TopUpWalletRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'Trả về URL để redirect sang VNPay { paymentUrl: ''...'' }'
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Dữ liệu đầu vào không hợp lệ
